networks:
    devcontainer:
        internal: false
    wiremock:
        internal: true

services:
    devcontainer:
        build:
            context: './'
            dockerfile: 'Dockerfile'
        command:
            - 'sleep'
            - 'infinity'
        depends_on:
            wiremock:
                condition: 'service_healthy'
                restart: true
        environment:
            WIREMOCK_URL: 'http://wiremock:8080'
        init: true
        ipc: 'host'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'devcontainer'
            - 'wiremock'
        ports:
            - '63010:63010'
            - '127.0.0.1:63011-63012:63011-63012'
            - '63013:63013'
            - '127.0.0.1:63014-63019:63014-63019'
        restart: 'always'
        volumes:
            - bind:
                  create_host_path: false
              source: '..'
              target: '/workspace'
              type: 'bind'
        working_dir: '/workspace'

    wiremock:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1:8080/__admin/health']
            timeout: '5s'
        image: 'docker.io/wiremock/wiremock:3.13.2-3@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks: ['wiremock']
        restart: 'always'
        shm_size: '128mb'
        stop_grace_period: '30s'
